name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync backend dependencies (macOS)
        if: matrix.platform == 'mac'
        working-directory: demucs-backend
        run: uv sync --frozen

      # On Windows/Linux bundle torch CPU-only to keep the binary small.
      # Also remove the nvidia-* / triton packages left behind by the CUDA
      # torch: the PyInstaller torch hook would bundle them otherwise
      # (~7GB, over GitHub's 2GB release asset limit).
      - name: Sync backend dependencies (CPU torch)
        if: matrix.platform != 'mac'
        working-directory: demucs-backend
        run: |
          uv sync --frozen
          uv pip uninstall torch torchaudio
          uv pip list --format=freeze | grep -E '^(nvidia|triton)' | cut -d= -f1 | xargs -r uv pip uninstall
          uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install frontend dependencies
        working-directory: demucs-gui
        run: |
          npm ci
          npm install-scripts approve --all || true

      - name: Build frontend
        working-directory: demucs-gui
        run: npm run build

      - name: Bundle backend with PyInstaller
        working-directory: demucs-backend
        shell: bash
        run: |
          uv run --with pyinstaller pyinstaller ../packaging/backend_entry.py \
            --name stemify-backend \
            --onefile \
            --noconfirm \
            --distpath ../backend-dist \
            --workpath ../backend-build \
            --paths . \
            --collect-submodules demucs \
            --collect-data demucs \
            --collect-submodules librosa \
            --collect-data librosa \
            --collect-submodules flask \
            --collect-submodules waitress \
            --exclude-module tensorboard \
            --exclude-module torch.utils.tensorboard

      - name: Build Electron app
        working-directory: demucs-gui
        run: npx electron-builder

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stemify-${{ matrix.platform }}
          path: |
            demucs-gui/release/*.dmg
            demucs-gui/release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            🎵 **Stemify - The Audio Splitter**

            Split any song into vocals, drums, bass and instrumental with AI.

            ## Downloads
            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `Stemify-*-arm64.dmg` |
            | Windows (x64) | `Stemify Setup *.exe` |

            The Demucs model (~84 MB) is downloaded automatically on first use.
            macOS: first launch requires right-click → Open (unsigned app).
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
